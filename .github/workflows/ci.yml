# Typecheck, lint, tests, licence check and a production build on every push to main and every pull
# request. The built dist/ is attached as an artifact so a change can be loaded unpacked
# (chrome://extensions → Load unpacked) without building it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version: "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
